# The match of Pocket Duty and what a frame draws, behind a C interface, for
# the 3DS host in ../src. citro3d is a C library made mostly of `static inline`
# functions, so the renderer is C and this crate is a static library.
#
# Standalone workspace: armv6k-nintendo-3ds needs a nightly compiler and
# build-std (.cargo/config.toml, rust-toolchain.toml).
#
#   cargo build --release      (in this directory)

[package]
name = "duty-n3ds-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "duty_n3ds_core"
crate-type = ["staticlib"]

[dependencies]
# The ARM11's VFP has a square root instruction.
duty-sim = { path = "../../crates/duty-sim", default-features = false, features = ["hw-sqrt"] }
duty-pack = { path = "../../crates/duty-pack", default-features = false }
# The flow around the match; the interface's channel is answered in src/wire.rs.
duty-interface = { path = "../../crates/duty-interface", default-features = false }
# The maps' packs as pieces: the manifest and the reader the C host reads a pack through
# (`pocket3d_packs.h`; the functions are in this library).
pocket3d-packs = { path = "../../vendor/pocketjs/engine/pocket3d/crates/pocket3d-packs", default-features = false, features = ["cabi"] }

[profile.release]
# The target defaults to unwinding; a static library in a libctru program has no unwinder.
panic = "abort"
opt-level = 3
codegen-units = 1
# Whole-program: the library keeps its allocator and its panic handler to itself, and links beside
# PocketJS's UI core, which is built the same way.
lto = true

[workspace]

[package]
name = "duty-interface"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The renderer's side of Pocket Duty's interface: the protocol of ui/, the flow around a match, and the channel a PocketJS guest opens in the process"

[features]
default = ["std"]
# Without `std` the crate needs only `core` and `alloc` (the device builds).
std = ["duty-sim/std"]
# The guest's service ops answered through the QuickJS API (the PSP, whose host is Rust).
guest = ["dep:libquickjs-sys"]

[dependencies]
duty-sim = { path = "../duty-sim", default-features = false }
libm = "0.2"
libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b", optional = true }

[package]
name = "duty-cook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Duty's compiler: lowers the DutyIR the reference exports to a device pack, and draws a frame of it on this computer"

[dependencies]
duty-pack = { path = "../duty-pack" }
duty-sim = { path = "../duty-sim" }
meshopt = "0.6"
pocket-psp-ge = { path = "../../vendor/pocketjs/devices/psp/pocket-psp-ge" }
png = "0.17"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Pocket Duty drawn with wgpu: in a browser tab over WebGPU (wasm32), and on
# the machine that builds it (Metal), where frames go to files.
#
# The match is crates/duty-sim and the flow of crates/duty-interface, as the
# PSP links them. The pack is the PSP's (profiles/psp30.json), read as it is.
# Everything that is not this game's is PocketJS's browser kernel
# (vendor/pocketjs/devices/web/pocket-web-wgpu): the GPU device and its
# screens, the interface's overlay pass, ranges of a pack.
#
#   bun tools/wgpu.ts build | serve | dist | shot | check     (from the repository root)

[package]
name = "duty-wgpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Duty's wgpu renderer: the PSP's pack in a browser tab and on the build machine"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "duty-shot"
path = "src/bin/shot.rs"

[dependencies]
duty-sim = { path = "../crates/duty-sim" }
duty-pack = { path = "../crates/duty-pack" }
duty-interface = { path = "../crates/duty-interface" }
pocket-web-wgpu = { path = "../vendor/pocketjs/devices/web/pocket-web-wgpu" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The command line tool that writes the JavaScript side must be this version (tools/wgpu.ts checks).
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[workspace]
resolver = "2"
